receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Pseudonymise the end user before traces leave the collector.
  attributes/privacy:
    actions:
      - key: enduser.id
        action: hash

exporters:
  otlp/phoenix:
    endpoint: phoenix:4317
    tls: { insecure: true }
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  # Langfuse (cloud or self-hosted) speaks OTLP/HTTP: uncomment and set LANGFUSE_AUTH=base64(pk:sk).
  # otlphttp/langfuse:
  #   endpoint: https://cloud.langfuse.com/api/public/otel
  #   headers: { Authorization: "Basic ${env:LANGFUSE_AUTH}" }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [otlp/phoenix, otlp/jaeger]
